services:
  postgres:
    image: postgres:16-alpine
    container_name: retailsync_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailsync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailsync_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-retailsync_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailsync_user} -d ${POSTGRES_DB:-retailsync_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
